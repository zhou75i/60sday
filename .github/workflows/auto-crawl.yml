name: Auto Crawl 60s Data and Generate Image

# 定时触发：北京时间1:20/1:30/1:40/1:50执行（UTC 17:20/30/40/50）
on:
  schedule:
    - cron: '20,30,40,50 17 * * *'
  workflow_dispatch: # 手动触发（方便测试）

jobs:
  crawl-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 任务超时时间（3小时）
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Puppeteer系统依赖（Ubuntu）
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm-dev libxkbcommon-dev libgbm-dev libasound-dev libatspi2.0-0 libxshmfence-dev

      - name: 循环执行爬虫脚本（5分钟重试，覆盖1:20-2:00）
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          BRANCH: main
        run: |
          # ====================== 已修改：5分钟重试 × 8次 = 40分钟 ======================
          MAX_RETRIES=8
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "====================================="
              echo "第 $((RETRY_COUNT + 1)) 次执行 | 剩余 $((MAX_RETRIES - RETRY_COUNT - 1)) 次"
              echo "====================================="
              
              # 执行爬虫脚本
              npm run crawl
              
              # 成功直接退出
              if [ $? -eq 0 ]; then
                  echo "✅ 脚本执行成功，退出任务"
                  exit 0
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              # 未达到最大次数则等待5分钟
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⏳ 5分钟后进行下一次重试..."
                  sleep 300  # 5分钟 = 300秒
              fi
          done
          
          echo "❌ 今日已达到最大重试次数，任务结束"
          exit 1

      - name: 自动提交图片（仅成功时执行）
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Auto update 60sday image for ${{ github.run_date }}'
          file_pattern: 'static/images/*.png'
