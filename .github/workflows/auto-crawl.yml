name: 60s Daily Crawl

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "目标日期 YYYY-MM-DD，留空使用 UTC 日期"
        required: false
        type: string

jobs:
  crawl:
    runs-on: ubuntu-latest
    concurrency:
      group: 60s-daily-crawl
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Random delay
        run: |
          DELAY=$((RANDOM % 240 + 30))
          echo "随机等待 ${DELAY} 秒..."
          sleep "$DELAY"

      - name: Generate news image
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          MAX_RETRIES: 3
          RETRY_BASE_MS: 3000
        run: |
          TARGET_DATE="${{ inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u +%F)
          fi
          echo "目标日期：$TARGET_DATE"
          node src/update60s.js --date="$TARGET_DATE"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/60s static/images
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "chore: update 60s news"
            git push
          fi
