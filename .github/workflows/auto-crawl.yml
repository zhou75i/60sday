name: 60s Daily Crawl
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '目标日期 YYYY-MM-DD，留空使用 UTC 日期'
        required: false
        type: string
jobs:
  crawl:
    runs-on: ubuntu-latest
    concurrency:
      group: 60s-daily-crawl
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: 随机延迟
        run: sleep $((RANDOM % 240 + 30))
      - name: 生成新闻图片
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          MAX_RETRIES: 3
          RETRY_BASE_MS: 3000
        run: |
          TARGET_DATE='${{ inputs.date }}'
          [ -z "$TARGET_DATE" ] && TARGET_DATE=$(date -u +%F)
          node src/update60s.js --date="$TARGET_DATE"
      - name: 提交生成结果
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/60s static/images
          git diff --cached --quiet || git commit -m "chore: update 60s news"
          git push
