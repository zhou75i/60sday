<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      margin: 0;
      background: #fff;
    }

    canvas {
      display: none;
    }

    #img-result {
      max-width: 100%;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>
<img id="img-result">

<script>
const CONFIG = {
  dateY: 290,
  newsStartY: 400,

  padding: {
    left: 50,
    right: 50
  },

  clipExtra: 24,

  newsInnerLineReduce: 15,
  newsBetweenAdd: 15,

  font: {
    date: {
      size: 32,
      color: '#fff'
    },

    news: {
      size: 28,
      color: '#000'
    },

    weiyu: {
      size: 26,
      color: '#000'
    },

    lineHeight: 1.8
  }
};


// ============================================================
// 图片加载
// ============================================================

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.crossOrigin = 'anonymous';

    img.onload = () => resolve(img);

    img.onerror = () => {
      reject(new Error('图片加载失败：' + url));
    };

    img.src = url;
  });
}


// ============================================================
// 字体加载
// ============================================================

async function loadFonts(base) {
  const fontList = [
    {
      name: 'DouyinSansBold',
      file: 'DouyinSansBold.otf'
    },
    {
      name: 'NotoSansCJK',
      file: 'NotoSansCJKsc-Regular.otf'
    }
  ];

  for (const item of fontList) {
    try {
      const url =
        `https://cdn.jsdmirror.com/gh/${base}/fonts/${item.file}`;

      const font = new FontFace(
        item.name,
        `url(${url})`
      );

      await font.load();

      document.fonts.add(font);

      console.log('字体加载成功：', item.name);
    } catch (error) {
      console.warn(
        '字体加载失败：',
        item.name,
        error.message
      );
    }
  }

  await document.fonts.ready;
}


// ============================================================
// 字体列表
// ============================================================

const FONT_FAMILIES = [
  'DouyinSansBold',
  'NotoSansCJK',
  'Noto Sans CJK SC',
  'Noto Sans SC',
  'Microsoft YaHei',
  'SimHei',
  'Arial',
  'sans-serif'
];


// ============================================================
// 判断字体是否可用
// ============================================================

function isFontLoaded(fontName) {
  try {
    return document.fonts.check(`28px "${fontName}"`);
  } catch {
    return false;
  }
}


// ============================================================
// 检测字符是否存在于字体
//
// 说明：
// Canvas measureText() 无法 100% 判断字形是否存在。
// 这里通过检测字体是否加载 + 字符测量 + tofu 对比，
// 尽量避免生僻字被绘制成空白。
// ============================================================

function canRenderCharacter(ctx, char, fontName, size) {
  if (!char) return true;

  if (
    fontName !== 'sans-serif' &&
    !isFontLoaded(fontName)
  ) {
    return false;
  }

  const oldFont = ctx.font;

  ctx.font = `${size}px "${fontName}"`;

  const width = ctx.measureText(char).width;

  // 常见不可绘制情况
  const invalid =
    !width ||
    width <= 0 ||
    !Number.isFinite(width);

  ctx.font = oldFont;

  return !invalid;
}


// ============================================================
// 为每个字符选择字体
// ============================================================

function getCharacterFont(ctx, char, size) {
  for (const fontName of FONT_FAMILIES) {
    if (
      canRenderCharacter(
        ctx,
        char,
        fontName,
        size
      )
    ) {
      return fontName;
    }
  }

  return 'sans-serif';
}


// ============================================================
// 获取字符宽度
// ============================================================

function getCharacterWidth(ctx, char, size) {
  const fontName =
    getCharacterFont(ctx, char, size);

  ctx.font =
    `${size}px "${fontName}"`;

  return {
    width: ctx.measureText(char).width,
    fontName
  };
}


// ============================================================
// 自动换行
// ============================================================

function wrap(ctx, text, maxWidth, size) {
  const lines = [];

  let line = '';

  for (const char of String(text)) {
    const result =
      getCharacterWidth(ctx, char, size);

    const currentWidth =
      line
        .split('')
        .reduce((sum, c) => {
          return sum +
            getCharacterWidth(ctx, c, size).width;
        }, 0);

    if (
      currentWidth + result.width > maxWidth &&
      line
    ) {
      lines.push(line);
      line = char;
    } else {
      line += char;
    }
  }

  if (line) {
    lines.push(line);
  }

  return lines;
}


// ============================================================
// 逐字绘制，自动字体回退
// ============================================================

function draw(
  ctx,
  text,
  x,
  y,
  size,
  color
) {
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  let currentX = x;

  for (const char of String(text)) {
    const result =
      getCharacterWidth(ctx, char, size);

    ctx.font =
      `${size}px "${result.fontName}"`;

    ctx.fillText(
      char,
      currentX,
      y
    );

    currentX += result.width;
  }
}


// ============================================================
// 生成图片
// ============================================================

async function generate() {
  try {
    const D = window.DATA;

    if (
      !D ||
      !Array.isArray(D.news) ||
      !D.date
    ) {
      throw new Error('数据格式错误');
    }

    const base =
      `${window.REPO_OWNER}/${window.REPO_NAME}@main`;

    await loadFonts(base);

    const [
      banner,
      footer
    ] = await Promise.all([
      loadImage(
        `https://cdn.jsdmirror.com/gh/${base}/img/1.png`
      ),

      loadImage(
        `https://cdn.jsdmirror.com/gh/${base}/img/2.png`
      )
    ]);

    const w = banner.width;

    const canvas =
      document.getElementById('canvas');

    const ctx =
      canvas.getContext('2d');

    const maxWidth =
      w -
      CONFIG.padding.left -
      CONFIG.padding.right;

    // ========================================================
    // 先计算内容高度
    // ========================================================

    let y =
      CONFIG.newsStartY + 20;

    const newsLines = [];

    for (let i = 0; i < D.news.length; i++) {
      const text =
        `${i + 1}、${String(D.news[i]).trim()}`;

      const lines =
        wrap(
          ctx,
          text,
          maxWidth,
          CONFIG.font.news.size
        );

      newsLines.push(lines);

      for (const line of lines) {
        y +=
          CONFIG.font.news.size *
          CONFIG.font.lineHeight *
          1.2 -
          CONFIG.newsInnerLineReduce;
      }

      if (i < D.news.length - 1) {
        y += CONFIG.newsBetweenAdd;
      }
    }

    y += 30;

    const tipText =
      `微语：${D.tip || ''}`;

    const tipLines =
      wrap(
        ctx,
        tipText,
        maxWidth,
        CONFIG.font.weiyu.size
      );

    for (const line of tipLines) {
      y +=
        CONFIG.font.weiyu.size *
        CONFIG.font.lineHeight *
        1.2;
    }

    const contentHeight =
      y + CONFIG.clipExtra;

    const totalHeight =
      contentHeight + footer.height;

    // ========================================================
    // 创建动态高度画布
    // ========================================================

    canvas.width = w;
    canvas.height = totalHeight;

    ctx.fillStyle = '#fff';

    ctx.fillRect(
      0,
      0,
      w,
      totalHeight
    );

    // 顶部图片
    ctx.drawImage(
      banner,
      0,
      0
    );

    // 日期
    draw(
      ctx,
      `${D.date} / ${D.day_of_week || ''}`,
      CONFIG.padding.left,
      CONFIG.dateY,
      CONFIG.font.date.size,
      CONFIG.font.date.color
    );

    // ========================================================
    // 绘制新闻
    // ========================================================

    y =
      CONFIG.newsStartY + 20;

    for (let i = 0; i < newsLines.length; i++) {
      const lines =
        newsLines[i];

      for (const line of lines) {
        draw(
          ctx,
          line,
          CONFIG.padding.left,
          y,
          CONFIG.font.news.size,
          CONFIG.font.news.color
        );

        y +=
          CONFIG.font.news.size *
          CONFIG.font.lineHeight *
          1.2 -
          CONFIG.newsInnerLineReduce;
      }

      if (i < newsLines.length - 1) {
        y += CONFIG.newsBetweenAdd;
      }
    }

    y += 30;

    // ========================================================
    // 绘制微语
    // ========================================================

    for (const line of tipLines) {
      draw(
        ctx,
        line,
        CONFIG.padding.left,
        y,
        CONFIG.font.weiyu.size,
        CONFIG.font.weiyu.color
      );

      y +=
        CONFIG.font.weiyu.size *
        CONFIG.font.lineHeight *
        1.2;
    }

    // ========================================================
    // 合成最终图片
    // ========================================================

    const out =
      document.createElement('canvas');

    out.width = w;

    out.height =
      y +
      CONFIG.clipExtra +
      footer.height;

    const o =
      out.getContext('2d');

    o.fillStyle = '#fff';

    o.fillRect(
      0,
      0,
      out.width,
      out.height
    );

    // 复制内容区域
    o.drawImage(
      canvas,
      0,
      0,
      w,
      y + CONFIG.clipExtra,
      0,
      0,
      w,
      y + CONFIG.clipExtra
    );

    // 底部图片
    o.drawImage(
      footer,
      0,
      y + CONFIG.clipExtra
    );

    // 输出图片
    window.IMAGE_BASE64 =
      out.toDataURL('image/png');

    document.getElementById(
      'img-result'
    ).src = window.IMAGE_BASE64;

  } catch (error) {
    window.IMAGE_ERROR =
      error.message;

    throw error;
  }
}
</script>

</body>
</html>
