<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><style>body{margin:0;background:#fff}canvas{display:none}#img-result{max-width:100%}</style></head><body><canvas id="canvas"></canvas><img id="img-result"><script>
const CONFIG={dateY:290,newsStartY:400,padding:{left:50,right:50},clipExtra:24,newsInnerLineReduce:15,newsBetweenAdd:15,font:{date:{size:32,color:'#fff'},news:{size:28,color:'#000'},weiyu:{size:26,color:'#000'},lineHeight:1.8}};
function loadImage(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(Error('图片加载失败: '+url));i.src=url})}
async function loadFonts(base){for(const [name,file] of [['DouyinSansBold','DouyinSansBold.otf'],['NotoSansCJK','NotoSansCJKsc-Regular.otf']]){try{const f=new FontFace(name,`url(https://cdn.jsdmirror.com/gh/${base}/fonts/${file})`);await f.load();document.fonts.add(f)}catch(e){console.warn('字体加载失败',name,e.message)}}await document.fonts.ready}
function family(){return 'DouyinSansBold, NotoSansCJK, Noto Sans CJK SC, Microsoft YaHei, SimHei, Arial, sans-serif'}
function wrap(ctx,text,max){const a=[];let line='';for(const c of String(text)){if(ctx.measureText(line+c).width>max&&line){a.push(line);line=c}else line+=c}if(line)a.push(line);return a}
function draw(ctx,text,x,y,size,color){ctx.font=`${size}px ${family()}`;ctx.fillStyle=color;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(String(text),x,y)}
async function generate(){try{const D=window.DATA;if(!D||!Array.isArray(D.news)||!D.date)throw Error('数据格式错误');const base=`${window.REPO_OWNER}/${window.REPO_NAME}@main`;await loadFonts(base);const [banner,footer]=await Promise.all([loadImage(`https://cdn.jsdmirror.com/gh/${base}/img/1.png`),loadImage(`https://cdn.jsdmirror.com/gh/${base}/img/2.png`)]);const w=banner.width,c=document.getElementById('canvas'),ctx=c.getContext('2d');c.width=w;c.height=6000;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,c.height);ctx.drawImage(banner,0,0);draw(ctx,`${D.date} / ${D.day_of_week||''} / 农历${D.lunar_date||''}`,50,CONFIG.dateY,CONFIG.font.date.size,CONFIG.font.date.color);let y=CONFIG.newsStartY+20,max=w-100;for(let i=0;i<D.news.length;i++){const lines=wrap(ctx,`${i+1}、${String(D.news[i]).trim()}`,max);for(const line of lines){draw(ctx,line,50,y,CONFIG.font.news.size,CONFIG.font.news.color);y+=CONFIG.font.news.size*CONFIG.font.lineHeight*1.2-CONFIG.newsInnerLineReduce}if(i<D.news.length-1)y+=CONFIG.newsBetweenAdd}y+=30;for(const line of wrap(ctx,`微语：${D.tip||''}`,max)){draw(ctx,line,50,y,CONFIG.font.weiyu.size,CONFIG.font.weiyu.color);y+=CONFIG.font.weiyu.size*CONFIG.font.lineHeight*1.2}const h=y+CONFIG.clipExtra+footer.height,out=document.createElement('canvas');out.width=w;out.height=h;const o=out.getContext('2d');o.fillStyle='#fff';o.fillRect(0,0,w,h);o.drawImage(c,0,0,w,y+CONFIG.clipExtra,0,0,w,y+CONFIG.clipExtra);o.drawImage(footer,0,y+CONFIG.clipExtra);window.IMAGE_BASE64=out.toDataURL('image/png');document.getElementById('img-result').src=window.IMAGE_BASE64}catch(e){window.IMAGE_ERROR=e.message;throw e}}
</script></body></html>
